<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Your Numbite sign-in code</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f6;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f4f5f6;font-size:1px;line-height:1px;">Your Numbite code is {{ .Token }}. It works for 1 hour.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f6;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td style="padding:0 4px 20px 4px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="vertical-align:middle;"><img src="https://numbite.com/icons/icon-192.png" width="40" height="40" alt="" style="display:block;border:0;border-radius:10px;"></td>
                <td style="vertical-align:middle;padding-left:10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;color:#0b1a12;letter-spacing:-0.2px;">Numbite</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background-color:#ffffff;border-radius:24px;padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <h1 style="margin:0 0 8px 0;font-size:26px;line-height:1.2;font-weight:800;color:#0b1a12;letter-spacing:-0.4px;">Your sign-in code</h1>
            <p style="margin:0 0 24px 0;font-size:17px;line-height:1.45;color:#4a4f4c;">Type this code in Numbite to sign in.</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background-color:#d6efa0;border:2px solid #052e16;border-radius:20px;padding:22px 12px;">
                  <span style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;font-size:46px;line-height:1;font-weight:800;color:#052e16;letter-spacing:10px;padding-left:10px;">{{ .Token }}</span>
                </td>
              </tr>
            </table>
            <p style="margin:20px 0 0 0;font-size:16px;line-height:1.45;color:#0b1a12;">It works for <strong>1 hour</strong>.</p>
            <p style="margin:24px 0 0 0;padding-top:20px;border-top:1px solid #e4e7e5;font-size:14px;line-height:1.5;color:#5f6361;">Didn't ask for a code? You can ignore this email. Nobody can sign in without it.</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 8px 0 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#5f6361;">
            Numbite · <a href="https://numbite.com" style="color:#046c4f;text-decoration:underline;">numbite.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
