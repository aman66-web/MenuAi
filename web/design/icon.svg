<!-- Menu Math app icon (our own mark, not a restaurant's): the app's "left today" ring in white, closing on a dot, on the
     brand green gradient. Full-bleed square; everything sits inside the 80% maskable safe zone. Rendered by e2e/brand.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="0.45" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="12%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <!-- track, then three quarters of the ring from 12 o'clock clockwise -->
  <circle cx="256" cy="262" r="146" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="58"/>
  <path d="M256 116 A146 146 0 1 1 110 262" fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round"/>
  <circle cx="256" cy="262" r="46" fill="#ffffff"/>
</svg>
