<!-- Menu Math app icon (our own mark, not a restaurant's): the app's "left today" ring in the sun gradient, closing on a
     dot, on the ember-dark base with its warm glow. Full-bleed square; everything sits inside the 80% maskable safe zone.
     Rendered to PNG by e2e/brand.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="8%" r="95%">
      <stop offset="0" stop-color="#ee5a2a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#d92c7a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.46" stop-color="#f7a04b"/>
      <stop offset="1" stop-color="#ee5a2a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0a0709"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- track, then three quarters of the ring from 12 o'clock clockwise -->
  <circle cx="256" cy="262" r="146" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="58"/>
  <path d="M256 116 A146 146 0 1 1 110 262" fill="none" stroke="url(#sun)" stroke-width="58" stroke-linecap="round"/>
  <circle cx="256" cy="262" r="46" fill="url(#sun)"/>
</svg>
