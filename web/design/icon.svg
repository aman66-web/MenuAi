<!-- Numbite app icon (our own mark, not a restaurant's): a white plate with a fork on it and a bite out of the rim ("num" + "bite"),
     flat on the brand green gradient. Founder's pick on 12 October 2026 (round 4, "L · plate and fork"). Full-bleed square; the plate
     sits inside the 80% maskable safe zone. Rendered by e2e/brand.mjs; the iPhone's 1024 px icon is drawn from it too. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="0.45" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="12%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
    <!-- the bite: a row of three tooth marks taken out of the plate's rim at about half past one -->
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#ffffff"/>
      <circle cx="428.5" cy="89.5" r="96" fill="#000000"/>
      <circle cx="416.8" cy="184.8" r="46" fill="#000000"/>
      <circle cx="360.7" cy="157.3" r="46" fill="#000000"/>
      <circle cx="333.2" cy="101.2" r="46" fill="#000000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <g filter="url(#shadow)">
    <g mask="url(#bite)">
      <circle cx="256" cy="262" r="172" fill="#ffffff"/>
      <g fill="#15803d">
        <rect x="213" y="156" width="18" height="90" rx="9"/>
        <rect x="247" y="156" width="18" height="90" rx="9"/>
        <rect x="281" y="156" width="18" height="90" rx="9"/>
        <path d="M213 226 H299 V244 C299 264 286 276 271 280 V360 C271 369 264 376 256 376 C248 376 241 369 241 360 V280 C226 276 213 264 213 244 Z"/>
      </g>
    </g>
  </g>
</svg>
