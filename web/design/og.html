<!doctype html>
<!-- Open Graph / social card for the site (1200x630), our own design. Rendered by e2e/brand.mjs; {{NAME}} and
     {{TAGLINE}} come from site.config.ts. In the app's own ink, sun and white with #0b1a12 (colour meeting, 19 November 2026, approved by the founder that
     day): the ink page, white words, the one key word in sun, white tags with #0b1a12 words; no gradients, glows or coloured shadows. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Jakarta; src: url(../app/fonts/PlusJakartaSans-latin.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: Playfair; src: url(../app/fonts/PlayfairDisplay-Italic-latin.woff2) format("woff2"); font-style: italic; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #1d2320; color: #ffffff; font-family: Jakarta, sans-serif; position: relative; }
.wrap { position: relative; display: flex; align-items: center; gap: 64px; padding: 0 96px; height: 100%; }
.icon { width: 220px; height: 220px; border-radius: 52px; overflow: hidden; flex: none; }
.icon img { width: 100%; height: 100%; display: block; }
.name { font-size: 40px; font-weight: 700; letter-spacing: -.01em; color: #ffffff; }
h1 { margin: 10px 0 0; font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.03em; }
em { font-family: Playfair, serif; font-weight: 500; color: #d6efa0; padding-right: 6px; }
.pills { display: flex; gap: 14px; margin-top: 34px; }
.pill { font-size: 24px; font-weight: 600; padding: 12px 22px; border-radius: 12px; background: #ffffff; color: #0b1a12; }
</style></head><body><div class="wrap">
  <div class="icon"><img src="icon.svg" alt=""></div>
  <div>
    <div class="name">{{NAME}}</div>
    <h1>Know your macros <em>before</em> you order.</h1>
    <div class="pills"><span class="pill">kcal</span><span class="pill">protein</span><span class="pill">carbs</span><span class="pill">fat</span></div>
  </div>
</div></body></html>
