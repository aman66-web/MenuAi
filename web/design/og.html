<!doctype html>
<!-- Open Graph / social card for the site (1200x630), our own design. Rendered by e2e/brand.mjs; {{NAME}} and
     {{TAGLINE}} come from site.config.ts. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Jakarta; src: url(../app/fonts/PlusJakartaSans-latin.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: Playfair; src: url(../app/fonts/PlayfairDisplay-Italic-latin.woff2) format("woff2"); font-style: italic; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #050507; color: #f6f3ee; font-family: Jakarta, sans-serif; position: relative; }
body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 90% at 50% 0%, rgba(238,90,42,.38), rgba(217,44,122,.12) 50%, transparent 80%); }
.wrap { position: relative; display: flex; align-items: center; gap: 64px; padding: 0 96px; height: 100%; }
.icon { width: 220px; height: 220px; border-radius: 52px; overflow: hidden; flex: none; box-shadow: 0 30px 80px -30px rgba(238,90,42,.8); border: 1px solid rgba(255,255,255,.12); }
.icon img { width: 100%; height: 100%; display: block; }
.name { font-size: 40px; font-weight: 700; letter-spacing: -.01em; color: rgba(246,243,238,.72); }
h1 { margin: 10px 0 0; font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.03em; }
em { font-family: Playfair, serif; font-weight: 500; background: linear-gradient(100deg, #fff, #ffe2b8 40%, #ffb36b 66%, #ff7a8a); -webkit-background-clip: text; color: transparent; padding-right: 6px; }
.pills { display: flex; gap: 14px; margin-top: 34px; }
.pill { font-size: 24px; font-weight: 600; padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); }
</style></head><body><div class="wrap">
  <div class="icon"><img src="icon.svg" alt=""></div>
  <div>
    <div class="name">{{NAME}}</div>
    <h1>Know your macros <em>before</em> you order.</h1>
    <div class="pills"><span class="pill">kcal</span><span class="pill">protein</span><span class="pill">carbs</span><span class="pill">fat</span></div>
  </div>
</div></body></html>
